name: multipad
description: "Zero-Knowledge End-to-End Encrypted Cross-Platform Notes & Password Vault"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Backend & Realtime Sync
  supabase_flutter: ^2.8.0

  # Hardware Security & Local Biometrics
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # Cryptography (AES-256-GCM, PBKDF2)
  cryptography: ^2.7.2
  crypto: ^3.0.6

  # State Management
  provider: ^6.1.2

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
