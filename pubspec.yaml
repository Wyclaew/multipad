name: multipad
description: "Zero-Knowledge End-to-End Encrypted Cross-Platform Notes & Password Vault"
publish_to: "none"
version: 1.3.1+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Backend & Realtime Sync
  supabase_flutter: ^2.8.0

  # Hardware Security & Local Biometrics
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # Cryptography (AES-256-GCM, PBKDF2, Argon2id)
  cryptography: ^2.7.2
  crypto: ^3.0.6

  # State Management
  provider: ^6.1.2

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  shared_preferences: ^2.3.5
  http: ^1.2.2
  sqflite: ^2.4.6
  sqflite_common_ffi: ^2.4.6
  path: ^1.9.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  file_picker: ^11.0.3
  image: ^4.12.0
  zxing2: ^0.2.4
  markdown: ^7.3.1
  mobile_scanner: ^7.5.0
  xml: ^7.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
