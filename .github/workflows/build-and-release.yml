name: MultiPad CI/CD - Build & Release (Android, macOS, Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality-gate:
    name: Quality Gate (Analyze & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SQLite runtime library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run unit & widget tests
        run: flutter test

  build-android:
    name: Build Android APK
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure Android directory exists
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org=com.multipad
          fi

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare APK artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk MultiPad-Android.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: MultiPad-Android.apk

  build-macos:
    name: Build macOS DMG
    needs: quality-gate
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure macOS directory exists
        run: |
          if [ ! -d "macos" ]; then
            flutter create . --platforms=macos --org=com.multipad
          fi

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build macOS Release App
        run: flutter build macos --release

      - name: Sign App & Create DMG
        run: |
          APP_PATH="build/macos/Build/Products/Release/MultiPad.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="build/macos/Build/Products/Release/multipad.app"
          fi
          echo "Found app at: $APP_PATH"
          xattr -cr "$APP_PATH" || true
          codesign --force --deep --sign - "$APP_PATH" || true

          mkdir -p dmg_staging
          cp -R "$APP_PATH" "dmg_staging/MultiPad.app"
          ln -s /Applications "dmg_staging/Applications"

          cat <<'GUIDE' > "dmg_staging/MACOS_ACMA_KILAVUZU.txt"
          MultiPad macOS Kurulum & Açma Kılavuzu
          ======================================

          1. "MultiPad.app" dosyasını yanındaki "Applications" (Uygulamalar) klasörüne sürükleyin.
          2. Uygulamalar'dan MultiPad'i ilk kez açtığınızda macOS, uygulama ücretli Apple Developer ID sertifikasıyla
             noter onaylı (notarized) olmadığı için "MultiPad açılmadı / Apple kötü amaçlı yazılım denetimi yapamadı"
             uyarısı gösterebilir. Bu normaldir. Açmak için Apple'ın resmi adımlarından birini izleyin:
             YÖNTEM A (Sağ Tık):
             - Applications klasöründe MultiPad.app üzerine sağ tıklayın (veya Control + tıklayın) ve "Aç"ı seçin.
             - Açılan onay penceresinde tekrar "Aç" butonuna tıklayın.
             YÖNTEM B (Sistem Ayarları):
             - "Bitti"ye basın, ardından Apple menüsü -> Sistem Ayarları -> Gizlilik ve Güvenlik ekranını açın.
             - En alta kaydırın; "MultiPad açılması engellendi" yazısının yanındaki "Yine de Aç" (Open Anyway) butonuna tıklayın.
          GUIDE

          hdiutil create -volname "MultiPad" -srcfolder dmg_staging -ov -format UDZO MultiPad-macOS.dmg

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: MultiPad-macOS.dmg

  build-windows:
    name: Build Windows (ZIP & Installer)
    needs: quality-gate
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure Windows directory exists
        shell: pwsh
        run: |
          if (-not (Test-Path "windows")) {
            flutter create . --platforms=windows --org=com.multipad
          }

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Windows Release
        shell: pwsh
        run: |
          $env:CL = "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          flutter build windows --release

      - name: Zip Windows Build
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath MultiPad-Windows.zip -Force

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          $rawVer = (Get-Content pubspec.yaml | Select-String '^version:\s*(\S+)').Matches.Groups[1].Value
          $cleanVer = $rawVer.Split('+')[0]
          Write-Host "Compiling Inno Setup installer for version: $cleanVer"
          iscc "/DAppVersion=$cleanVer" windows/installer/multipad_setup.iss
          if (-not (Test-Path "MultiPad-Windows-Setup.exe")) {
            Write-Error "Installer MultiPad-Windows-Setup.exe not found at root!"
            exit 1
          }
          Write-Host "Successfully generated MultiPad-Windows-Setup.exe"

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: MultiPad-Windows.zip

      - name: Upload Windows Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: MultiPad-Windows-Setup.exe

  release:
    name: Create GitHub Release (Replace Previous)
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    needs: [build-android, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: release-assets

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: release-assets

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets

      - name: Compute SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum MultiPad-Android.apk MultiPad-macOS.dmg MultiPad-Windows-Setup.exe MultiPad-Windows.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Read Version from pubspec.yaml
        id: get_version
        run: |
          RAW_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          CLEAN_VER=$(echo "$RAW_VER" | cut -d+ -f1)
          echo "VERSION=v$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "Release version: v$CLEAN_VER"

      - name: Delete ALL previous GitHub Releases & old tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OLD_RELEASES=$(gh release list --json tagName -q '.[].tagName' || true)
          for tag in $OLD_RELEASES; do
            echo "Deleting old release: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done

      - name: Create Fresh Release with Artifacts & Checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.get_version.outputs.VERSION }}"
          gh release create "$TAG_NAME" \
            release-assets/MultiPad-Android.apk \
            release-assets/MultiPad-macOS.dmg \
            release-assets/MultiPad-Windows-Setup.exe \
            release-assets/MultiPad-Windows.zip \
            release-assets/SHA256SUMS.txt \
            --title "MultiPad $TAG_NAME" \
            --notes "### 🚀 MultiPad En Güncel Sürüm ($TAG_NAME)

          **İndirme Dosyaları:**
          - 📱 **Android:** \`MultiPad-Android.apk\` (Uygulama içi SHA-256 doğrulamalı güncelleme + Android Autofill + FLAG_SECURE)
          - 🍎 **macOS:** \`MultiPad-macOS.dmg\` (MultiPad.app, Touch ID, Menü Çubuğu + \`⌘⇧Space\` Hızlı Arama)
          - 🪟 **Windows Kurulum (Önerilen):** \`MultiPad-Windows-Setup.exe\` (Otomatik kurulum, Başlat Menüsü & Masaüstü kısayolları, üzerine temiz güncelleme)
          - 💼 **Windows Taşınabilir:** \`MultiPad-Windows.zip\` (Sistem Tepsisi, \`Ctrl+Shift+Space\` Hızlı Arama, \`multipad.exe\`)
          - 🔐 **Bütünlük Kontrolü:** \`SHA256SUMS.txt\`

          **Öne Çıkan Yenilikler ($TAG_NAME):**
          - **Passkey (FIDO2 / WebAuthn):** Hesaplara özel passkey saklama ve Bitwarden'dan (fido2Credentials) eksiksiz içe aktarma desteği.
          - **Biyometrik & Kilit Ergonomisi:** Açılışta otomatik biyometrik tetikleme, giriş ekranında yüzen mini parmak izi butonu, ayarlanabilir macOS arka plan kilidi ve Android ayarlar toleransı.
          - **Masaüstü Tarayıcı Eklentisi:** Manifest V3 tarayıcı eklentisi (Chrome/Edge/Firefox) ve 127.0.0.1 üzerinde şifreli loopback köprüsü.
          - **Güvenlik & Denetim:** Ayarlanabilir 2FA aralıkları (30/60/90 gün), şifreli Bitwarden JSON içe aktarımı, RAM bellek sıfırlama (zero-wiping), merkezi 1 Hz TOTP servisi ve kalibre edilmiş güvenlik denetimi.
          - **Android Autofill:** Yeni ve güncellenen şifreleri otomatik yakalama (SaveInfo) ve Bildirim Paneli Hızlı Ayarlar Kutucuğu (Quick Settings Tile).

          > **macOS İlk Açılış Notu:** Apple Developer ID noter onayı olmadığından ilk açılışta macOS uyarı verirse **Sağ tık -> Aç** veya *Sistem Ayarları -> Gizlilik ve Güvenlik -> Yine de Aç* adımlarını izleyin."
