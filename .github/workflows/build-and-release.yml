name: MultiPad CI/CD - Build & Release (Android, macOS, Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. BUILD ANDROID APK
  # -------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Platform Files
        run: flutter create . --platforms=android --org=com.multipad

      - name: Configure Android Manifest & Permissions
        run: |
          python3 - <<'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              xml = f.read()

          xml = xml.replace('android:label="multipad"', 'android:label="MultiPad"')

          perms = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.ACCESS_WIFI_STATE",
              "android.permission.CHANGE_WIFI_MULTICAST_STATE",
              "android.permission.USE_BIOMETRIC",
              "android.permission.USE_FINGERPRINT",
          ]
          inject = ""
          for p in perms:
              if p not in xml:
                  inject += f'    <uses-permission android:name="{p}"/>\n'

          if inject:
              xml = xml.replace("<application", inject + "    <application", 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(xml)
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk MultiPad-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: MultiPad-Android.apk

  # -------------------------------------------------------------
  # 2. BUILD MACOS DMG
  # -------------------------------------------------------------
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Ensure Platform Files
        run: flutter create . --platforms=macos --org=com.multipad

      - name: Configure macOS Name, Entitlements & Plist
        run: |
          python3 - <<'EOF'
          import os, plistlib

          app_info = "macos/Runner/Configs/AppInfo.xcconfig"
          if os.path.exists(app_info):
              with open(app_info, "r", encoding="utf-8") as f:
                  txt = f.read()
              txt = txt.replace("PRODUCT_NAME = multipad", "PRODUCT_NAME = MultiPad")
              with open(app_info, "w", encoding="utf-8") as f:
                  f.write(txt)

          # Configure entitlements for direct DMG distribution (no App Store provisioning profile)
          for ent_path in ["macos/Runner/DebugProfile.entitlements", "macos/Runner/Release.entitlements"]:
              if os.path.exists(ent_path):
                  with open(ent_path, "rb") as f:
                      data = plistlib.load(f)
                  data["com.apple.security.app-sandbox"] = False
                  data["com.apple.security.network.client"] = True
                  data["com.apple.security.network.server"] = True
                  data["com.apple.security.cs.allow-jit"] = True
                  with open(ent_path, "wb") as f:
                      plistlib.dump(data, f)

          # Add Local Network & Touch ID usage descriptions to Info.plist
          info_plist = "macos/Runner/Info.plist"
          if os.path.exists(info_plist):
              with open(info_plist, "rb") as f:
                  plist_data = plistlib.load(f)
              plist_data["CFBundleDisplayName"] = "MultiPad"
              plist_data["NSLocalNetworkUsageDescription"] = "MultiPad ayni Wi-Fi agindaki telefonunuzla sifreli cihaz eslestirmesi yapabilmek icin yerel ag erisimi gerektirir."
              plist_data["NSFaceIDUsageDescription"] = "MultiPad kasanizi Touch ID ile guvenli sekilde acmak icin kimlik dogrulamasi kullanir."
              with open(info_plist, "wb") as f:
                  plistlib.dump(plist_data, f)
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS App (Release)
        run: flutter build macos --release

      - name: Ad-Hoc Sign & Create DMG Bundle
        run: |
          APP_PATH="build/macos/Build/Products/Release/MultiPad.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="build/macos/Build/Products/Release/multipad.app"
          fi

          # Apply clean deep ad-hoc code signature for Apple Silicon / Intel compatibility
          codesign --force --deep --sign - "$APP_PATH"

          mkdir -p dmg_staging
          cp -R "$APP_PATH" "dmg_staging/MultiPad.app"
          ln -s /Applications "dmg_staging/Applications"

          cat <<'GUIDE' > "dmg_staging/MACOS_ACMA_KILAVUZU.txt"
          MultiPad macOS Kurulum & Açma Kılavuzu
          =====================================

          1. "MultiPad.app" dosyasını yanındaki "Applications" (Uygulamalar) klasörüne sürükleyin.
          2. Uygulamalar'dan MultiPad'i ilk kez açtığınızda macOS, uygulama ücretli Apple Developer ID sertifikasıyla
             noter onaylı (notarized) olmadığı için "MultiPad açılmadı / Apple kötü amaçlı yazılım denetimi yapamadı"
             uyarısı gösterebilir. (Açık kaynaklı bağımsız uygulamalarda normal bir macOS güvenlik adımıdır.)
          3. Bu uyarıyı tek seferlik onaylamak için:
             - Uyarı penceresinde "Bitti" (Done) butonuna basın.
             - Mac ekranınızın sol üstünden Apple Menüsü -> Sistem Ayarları -> Gizlilik ve Güvenlik bölümüne gidin.
             - En alta kaydırın; "MultiPad açılması engellendi" yazısının yanındaki "Yine de Aç" (Open Anyway) butonuna tıklayın.
             - Touch ID veya Mac şifrenizle onaylayın. Artık her zaman tek tıkla açılacaktır!
          GUIDE

          hdiutil create -volname "MultiPad" -srcfolder dmg_staging -ov -format UDZO MultiPad-macOS.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: MultiPad-macOS.dmg

  # -------------------------------------------------------------
  # 3. BUILD WINDOWS EXE / ZIP
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows EXE Bundle
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Ensure Platform Files
        run: flutter create . --platforms=windows --org=com.multipad

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable (Release)
        run: |
          $env:CL = "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          $env:_CL_ = "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          flutter build windows --release

      - name: Package Windows Binary (Zip)
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath MultiPad-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: MultiPad-Windows.zip

  # -------------------------------------------------------------
  # 4. PUBLISH RELEASE & DELETE PREVIOUS RELEASES
  # -------------------------------------------------------------
  release:
    name: Publish Release & Cleanup Old Versions
    needs: [build-android, build-macos, build-windows]
    if: always() && (needs.build-android.result == 'success' || needs.build-macos.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-apk
          path: release_assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-dmg
          path: release_assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-zip
          path: release_assets

      - name: Extract Current Version
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT
          echo "Current Version: v$VERSION"

      - name: Delete Old Releases & Tags (Keep Only Latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking existing releases..."
          OLD_RELEASES=$(gh release list --json tagName -q '.[].tagName' || true)
          for tag in $OLD_RELEASES; do
            echo "Deleting old release: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done

      - name: Create New GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.get_version.outputs.VERSION }}"
          gh release create "$TAG_NAME" \
            release_assets/* \
            --title "MultiPad $TAG_NAME" \
            --notes "### 🚀 MultiPad En Güncel Sürüm ($TAG_NAME)

          **İndirme Seçenekleri:**
          - 📱 **Android:** \`MultiPad-Android.apk\`
          - 🍎 **macOS:** \`MultiPad-macOS.dmg\` (Applications kısayolu & Touch ID uyumlu)
          - 🪟 **Windows:** \`MultiPad-Windows.zip\` (Zipten çıkarıp \`multipad.exe\` çalıştırın)

          **Öne Çıkan Yenilikler ($TAG_NAME):**
          - 📲 **Aynı Wi-Fi'dan Tek Kodla Cihaz Eşleştirme (Zero-Type Setup):** Ayarları, Supabase anahtarlarını ve şifrelerinizi telefona elle yazmadan X25519 şifreli tünel ve 6 haneli PIN ile anında aktarın
          - 🔐 **Uçtan Uca Şifreli Uzaktan Aktarım Kodu (\`MPSETUP:\`):** Farklı ağlardan da güvenli aktarım
          - 🍎 **macOS Keychain & DMG İyileştirmeleri:** Applications kısayolu, ad-hoc imza ve Touch ID Keychain uyumluluğu
          - 🔄 **Çift Yönlü Çevrimdışı Senkronizasyon (Offline-First Merge)**
          - 🛡️ **Uçtan Uca Şifreleme (AES-256-GCM + PBKDF2-HMAC-SHA256) & Biyometrik Kilit**"
